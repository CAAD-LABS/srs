listen              1935;
max_connections     1000;
daemon              off;

http_api {
    enabled         on;
    listen          1985;
    raw_api {
        enabled     on;
        allow_reload on;
    }
}

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}

rtc_server {
    enabled on;
    listen 8000;
    candidate $CANDIDATE;
}

vhost __defaultVhost__ {
    http_hooks {
        enabled         on;
        on_publish      http://172.17.0.1:8101/api/srs/on-publish;
        # E1: queda de publish vira evento (GUARD -> GUARDIÃO) em vez de
        # esperar o poller de 15s. O GUARD já tem o handler /api/srs/on-unpublish.
        on_unpublish    http://172.17.0.1:8101/api/srs/on-unpublish;
    }
    hls {
        enabled         on;
        # L1: fragmento curto alinhado ao keyframe (~ a cada 2s do ffmpeg) e
        # janela pequena — corta o buffer de entrega HLS do painel AO VIVO.
        hls_fragment    1;
        hls_window      5;
        hls_dispose     30;
        hls_cleanup     on;
    }
    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }
    rtc {
        enabled     on;
        # L2: converte o RTMP publicado em WebRTC para o player WHEP do painel
        # (latência <1s, contra ~2-3s do HLS). rtc_to_rtmp segue off (só play).
        rtmp_to_rtc on;
        rtc_to_rtmp off;
    }
    play {
        gop_cache_max_frames 150;
    }
    publish {
        firstpkt_timeout 5000;
        # E2: acima do watchdog de 10s do puller. Num soluço de P2P recuperável
        # (3-10s sem dado), o SRS NÃO derruba o publish antes do puller voltar —
        # evita o ciclo publish->unpublish->republish que faz o player piscar.
        normal_timeout   12000;
    }
}
